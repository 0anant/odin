<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO</title>
</head>
<body>

    <h1>TODO LIST</h1>
    <h4>1. Take Class</h4>
    <h4>2. Go to Gym</h4>
    <h5></h5>
    <div>
        <input type="text" placeholder="Type your todo"></input>
        <button onclick="addTodo()">Add Todo</button>
    </div>
    <script>
        function addTodo(){
            const inputVal = document.querySelector("input");
            const val = inputVal.value;
            document.querySelector('h5').innerHTML = val;
        }
    </script>
</body>
</html>
